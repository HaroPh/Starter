[project]
name = "exhibition-crm"
version = "0.1.0"
description = "Sales CRM and handoff assistant for an exhibition stand builder"
requires-python = ">=3.13,<3.14"

# Bounds here express intent; uv.lock pins the exact resolved versions and the image
# installs with `uv sync --frozen`, so every build gets byte-identical dependencies.
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn>=0.30,<1.0",
    "jinja2>=3.1,<4.0",
    "psycopg[binary,pool]>=3.2,<4.0",
    "pydantic-settings>=2.5,<3.0",
    "python-multipart>=0.0.9,<1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9.0",
    "httpx>=0.27,<1.0",
    "ruff>=0.6,<1.0",
    "pyyaml>=6.0,<7.0",
]

[tool.uv]
# This is an application, not a library: there is nothing to build or install, only
# dependencies to resolve. Avoids pulling in a build backend for no reason.
package = false

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "slow: needs the real archive in data/ (skipped when absent)",
]
